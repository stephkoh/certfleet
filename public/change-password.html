<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>certfleet — Mot de passe</title>
<script src="auth.js"></script>
<style>
:root{--blue:#0b3d91;--blue2:#1256c4;--bg:#f4f5f7;--card:#fff;--border:#e6e8eb;--text:#1d3557;--mute:#8892a3;
      --red:#dc2626;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;background:var(--bg);
     color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:34px;width:min(460px,100%);
     box-shadow:0 10px 40px rgba(0,0,0,.06)}
h1{font-size:20px;font-weight:700;margin-bottom:6px}
p.sub{font-size:12.5px;color:var(--mute);margin-bottom:22px;line-height:1.55}
label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;margin-top:15px}
label:first-of-type{margin-top:0}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
input:focus{outline:2px solid var(--blue2);outline-offset:-1px}
button{width:100%;margin-top:20px;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;
       font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:var(--blue2)}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:12.5px;margin-top:12px;min-height:18px;line-height:1.45}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.rule{font-size:11.5px;color:var(--mute);margin-top:7px;line-height:1.55}
.back{display:block;text-align:center;margin-top:20px;font-size:12.5px;color:var(--blue);text-decoration:none}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:11px 13px;
      font-size:12.5px;line-height:1.5;margin-bottom:20px}
</style>
</head>
<body>
<div class="box">
  <h1>Changer le mot de passe</h1>
  <p class="sub" id="who">…</p>

  <div class="warn" id="forced" hidden>
    Ce mot de passe vous a été attribué par un administrateur. Choisissez-en un
    nouveau pour continuer.
  </div>

  <form onsubmit="submitPw(event)" id="form">
    <label for="cur">Mot de passe actuel</label>
    <input id="cur" type="password" autocomplete="current-password" autofocus>

    <label for="nw">Nouveau mot de passe</label>
    <input id="nw" type="password" autocomplete="new-password">

    <label for="nw2">Confirmer le nouveau mot de passe</label>
    <input id="nw2" type="password" autocomplete="new-password">

    <div class="rule">12 caractères au minimum, mêlant minuscules, majuscules et chiffres.</div>
    <button type="submit" id="btn">Changer le mot de passe</button>
  </form>

  <div class="msg" id="msg"></div>
  <a class="back" href="index.html" id="back">← Retour aux certificats</a>
</div>

<script>
const msg = document.getElementById('msg');

async function submitPw(ev){
  ev.preventDefault();
  const current = document.getElementById('cur').value;
  const next = document.getElementById('nw').value;
  const again = document.getElementById('nw2').value;
  const btn = document.getElementById('btn');

  msg.className = 'msg';
  if (next !== again) { msg.className = 'msg err'; msg.textContent = 'Les deux saisies diffèrent.'; return; }

  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const r = await fetch('/api/me/password', {
      method: 'POST',
      headers: CERTFLEET_AUTH.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ current, next }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));

    msg.className = 'msg ok';
    msg.textContent = 'Mot de passe changé. Redirection…';
    // Les autres sessions ont été fermées côté serveur ; celle-ci reste valide.
    setTimeout(() => { location.href = 'index.html'; }, 1200);
  } catch(e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Changer le mot de passe';
  }
}

(async () => {
  const me = await CERTFLEET_AUTH.me();
  if (!me) { location.href = 'login.html'; return; }

  document.getElementById('who').textContent =
    'Compte « ' + (me.display_name || me.username) + ' ».';

  if (me.source !== 'local') {
    // Compte d'annuaire : rien à changer ici, le mot de passe vit dans l'AD.
    document.getElementById('form').hidden = true;
    document.getElementById('who').textContent =
      'Ce compte est géré par votre annuaire (Active Directory). Le mot de passe se ' +
      'change du côté de l\'annuaire, pas ici.';
    return;
  }
  if (me.must_change_password) {
    document.getElementById('forced').hidden = false;
    document.getElementById('back').hidden = true;
  }
})();
</script>
</body>
</html>
