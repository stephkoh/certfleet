# ═══════════════════════════════════════════════════════════════════
# NE PAS APPLIQUER TEL QUEL, et ne jamais committer les valeurs réelles.
#
# Créez plutôt le Secret en ligne de commande, pour que les valeurs ne
# transitent par aucun fichier :
#
#   kubectl -n certfleet create secret generic certfleet \
#     --from-literal=DATABASE_URL="postgres://certfleet:MOTDEPASSE@certfleet-db:5432/certfleet" \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=CERT_VAULT_KEY="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_PASSWORD="MOTDEPASSE"
#
# CERT_VAULT_KEY chiffre les clés privées de tous vos certificats.
# La perdre rend le coffre illisible : sauvegardez-la hors du cluster,
# au même titre qu'une clé de chiffrement de sauvegarde.
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: certfleet
  namespace: certfleet
type: Opaque
stringData:
  DATABASE_URL: "postgres://certfleet:CHANGEZ-MOI@certfleet-db:5432/certfleet"
  POSTGRES_PASSWORD: "CHANGEZ-MOI"

  # Jeton de secours : ouvre une session administrateur sans passer par la base.
  #   openssl rand -hex 32
  ADMIN_TOKEN: "CHANGEZ-MOI"

  # Coffre des clés privées, 32 octets en base64.
  #   openssl rand -base64 32
  CERT_VAULT_KEY: "CHANGEZ-MOI"

  # Mot de passe du premier administrateur. Laisser vide en fait tirer un au
  # hasard, affiché une seule fois dans les logs du pod.
  BOOTSTRAP_PASSWORD: ""
