# ═══════════════════════════════════════════════════════════════════
# certfleet — pile complète : base + application.
#
#   cp .env.example .env
#   echo "ADMIN_TOKEN=$(openssl rand -hex 32)"       >> .env
#   echo "CERT_VAULT_KEY=$(openssl rand -base64 32)" >> .env
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
#   docker compose up -d
#
# Puis http://localhost:8080. Le mot de passe du premier administrateur est
# affiché une seule fois au démarrage :  docker compose logs app
# ═══════════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certfleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: certfleet
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certfleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun port publié : la base n'est jointe que par l'application.
    restart: unless-stopped

  app:
    build: .
    image: certfleet:local
    environment:
      DATABASE_URL: postgres://certfleet:${POSTGRES_PASSWORD}@db:5432/certfleet

      # Jeton de secours : ouvre une session administrateur sans passer par la
      # base. À garder hors ligne, il dépanne si un mot de passe est perdu.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?definir ADMIN_TOKEN dans .env}

      # Chiffre les clés privées. Sans elle, une clé serait générée et stockée
      # EN BASE — autant laisser la clé sur la serrure.
      CERT_VAULT_KEY: ${CERT_VAULT_KEY:?definir CERT_VAULT_KEY dans .env}

      # Premier administrateur. Laisser BOOTSTRAP_PASSWORD vide fait tirer un
      # mot de passe au hasard, affiché une seule fois dans les logs.
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}

      # false en local sans HTTPS, sinon le navigateur refuse le cookie.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      TRUST_PROXY: ${TRUST_PROXY:-false}

      MONITOR_INTERVAL_MIN: ${MONITOR_INTERVAL_MIN:-360}
      RENEW_INTERVAL_MIN: ${RENEW_INTERVAL_MIN:-720}
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
